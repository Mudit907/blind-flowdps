# DIV2K blind Gaussian deblurring evaluation
# Single source of truth for all hyperparameters.
# To run: python scripts/evaluate.py --config experiments/configs/div2k_eval.yaml

experiment:
  project: "blind-flowdps"
  run_name: "div2k_blind_sigma8"
  seed: 42

data:
  dataset: "div2k"
  data_dir: "data/DIV2K_valid_HR"
  num_images: 15           # Start with 15; set to 100 for full eval
  img_size: 256
  image_ids: null          # null = sequential from 0001; or list e.g. [882, 1, 23]

degradation:
  task: "deblur_gauss"
  deg_scale: 8.0           # True sigma (used to generate y; NOT given to solver)
  noise_level: 0.03        # Additive Gaussian noise std

diffusion:
  model: "sd3-medium"
  NFE: 28                  # Number of function evaluations (diffusion steps)
  cfg_scale: 2.0           # Classifier-free guidance scale
  prompt: "a high quality photo"

data_consistency:
  stepsize: 15.0
  num_iters: 7

kernel_estimation:
  iterations: 15           # Adam steps per diffusion timestep
  lr: 0.3
  betas: [0.9, 0.99]
  sigma_init: [10.0, 10.0] # Starting guess (intentionally far from true value)
  sigma_min: 0.5
  sigma_max: 25.0

logging:
  log_wandb: true
  save_images: true
  output_dir: "experiments/results/div2k_blind_sigma8"
  log_sigma_trajectories: true   # Log per-step sigma values (needed for convergence analysis)
